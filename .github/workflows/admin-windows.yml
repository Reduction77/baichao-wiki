name: Check Windows Wiki Admin
on:
  push:
    branches: [main]
    paths:
      - 'admin/windows/**'
      - '.github/workflows/admin-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s admin/windows -p "test_*.py"
      - run: python admin/windows/app.py --help
