name: Publish Baichao Wiki
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Rebuild pinned GitHub data before publishing (does not advance the upstream commit)"
        type: boolean
        default: false
      check_upstream:
        description: "Check latest verified GitHub release without changing the pinned source"
        type: boolean
        default: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore bundled data and images
        run: |
          python3 tools/unpack_snapshot.py
          python3 tools/unpack_character_icons.py
      - name: Refresh source data (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_data
        run: |
          python3 tools/import_github_archive.py
          python3 tools/build_catalog_order.py
      - name: Apply reviewed character additions
        run: python3 tools/complete_character_data.py
      - name: Rebuild English data after manual refresh
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_data
        run: python3 tools/build_locales.py
      - name: Build team-builder role profiles
        run: python3 tools/build_team_profiles.py
      - name: Validate data and rendering
        run: |
          python3 tools/check_data.py
          python3 tools/test_character_completions.py
          node tools/test_reviewed_content.mjs
          node tools/test_core.mjs
          node tools/test_i18n.mjs
          node tools/test_render.mjs
          node tools/test_versions.mjs
          node tools/test_team_builder.mjs
          node tools/test_team_library.mjs
          node tools/test_catalog_order.mjs
          node tools/test_beta_catalog.mjs
          node tools/test_beta_render.mjs
          python3 tools/test_github_updates.py
      - name: Check upstream release (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.check_upstream
        run: python3 tools/check_github_updates.py --output web/data/source-status.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
