name: Publish Baichao Wiki
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Download live-version data before publishing (does not commit it)"
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore bundled data and images
        run: |
          python3 tools/unpack_snapshot.py
          python3 tools/unpack_character_icons.py
      - name: Refresh source data (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_data
        run: |
          python3 tools/sync_data.py --keep 1
          python3 tools/sync_beta.py
      - name: Validate data and rendering
        run: |
          python3 tools/check_data.py
          node tools/test_core.mjs
          node tools/test_render.mjs
          node tools/test_versions.mjs
          node tools/test_beta_render.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
